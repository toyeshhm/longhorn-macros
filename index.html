<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: the on-screen keyboard shrinks the layout viewport, so a sheet's
         sticky Add/Save button stays above the keyboard instead of being covered by it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#F7F3EA" />
    <meta name="color-scheme" content="light dark" />
    <!-- Blocking, and ahead of the bundle that carries the stylesheet: the press is chosen before the first paint. -->
    <script src="/theme-boot.js"></script>
    <link rel="preload" href="/fonts/bungee-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/courier-prime-400.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Both spellings: Safari still reads only the apple- one, Chrome warns unless the standard one is here too. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Macros" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Longhorn Macros</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
